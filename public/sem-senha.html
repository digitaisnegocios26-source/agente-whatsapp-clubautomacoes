<body style="background:var(--navy)"><div class="center"><div class="box"><h1>Falta a senha do painel</h1>
<p>No Railway, abra o serviço, vá em <b>Variables</b>, crie a variável <b>PAINEL_SENHA</b> com a senha que você quiser e clique em <b>Deploy</b>. Depois, atualize esta página.</p></div></div></body></html>
